<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta
      name="description"
      content="Sonata — streaming de música com MP3 completo e visual em Liquid Glass."
    />
    <!-- ?v= quebra o cache do navegador: ícone de aba é o item mais cacheado
         da página e ignorava troca de cor. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <title>Sonata</title>

    <!-- Fundo escuro e splash ANTES de qualquer CSS/JS: evita a tela branca
         enquanto o módulo carrega e o boot fala com o servidor. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050505;
        color: #fff;
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        animation: boot-in 0.7s cubic-bezier(0.32, 0.72, 0, 1) both;
      }
      #boot svg {
        width: 54px;
        height: 54px;
        filter: drop-shadow(0 8px 22px rgba(0, 0, 0, 0.65));
      }
      #boot b {
        /* O <i> abaixo é `display:block` com 96px — mais largo que o texto.
           Sem centralizar, a caixa do <b> vira 96px e "Sonata" (≈73px) fica
           colada na borda esquerda, deslocada do logo. */
        text-align: center;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #fff;
      }
      #boot i {
        display: block;
        width: 96px;
        height: 3px;
        margin-top: 4px;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, #7dd3fc, transparent);
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.25;
          transform: scaleX(0.6);
        }
        50% {
          opacity: 1;
          transform: scaleX(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot,
        #boot i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="boot-body" x1="8" y1="4" x2="56" y2="62" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#38bdf8" />
            <stop offset="0.4" stop-color="#0284c7" />
            <stop offset="1" stop-color="#082f49" />
          </linearGradient>
        </defs>
        <circle cx="32" cy="32" r="32" fill="url(#boot-body)" />
        <g fill="#ffffff">
          <rect x="12" y="25" width="7" height="14" rx="3.5" />
          <rect x="23" y="16" width="7" height="32" rx="3.5" />
          <rect x="34" y="20" width="7" height="24" rx="3.5" />
          <rect x="45" y="27" width="7" height="10" rx="3.5" />
        </g>
      </svg>
      <b>Sonata<i></i></b>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
